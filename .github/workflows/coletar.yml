name: Coletar numeros mais recentes

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar dados dos periodicos
        run: python coletar.py

      - name: Gravar dados.json no repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dados.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados dos periodicos"
            git push
          fi
