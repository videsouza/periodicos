name: Coletar números mais recentes

on:
  schedule:
    - cron: "17 9 * * *"     # todos os dias, 06:17 no horário de Brasília
  workflow_dispatch:          # permite rodar manualmente em Actions > Run workflow

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar dados dos periódicos
        run: python coletar.py

      - name: Gravar dados.json no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json
          git diff --cached --quiet || (git commit -m "Atualiza dados dos periódicos" && git push)
